server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compress text assets — reduces transfer size ~70%
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # SPA routing: unknown paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed static assets aggressively — Vite fingerprints filenames
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Never cache index.html — it references the hashed assets
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # PWA service worker must not be cached
    location = /sw.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
