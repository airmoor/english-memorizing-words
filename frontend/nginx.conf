server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers ──────────────────────────────────────────────────────
    # The SPA is served by nginx (the backend's helmet() only covers API
    # responses), so these headers must be set here or the HTML document ships
    # with no protection at all.
    #
    # The CSP intentionally restricts only vectors the app never uses
    # (framing, <base>, plugins, cross-origin form posts). It deliberately does
    # NOT constrain script-src/style-src/connect-src: index.html ships an inline
    # theme-bootstrap <script> and the app talks to a cross-origin API, so a
    # stricter policy would require a script hash that drifts on every build.
    # See the security review notes for the hash-based hardening follow-up.
    #
    # NOTE: nginx does not inherit `add_header` into locations that declare their
    # own `add_header`, so the set below is repeated in the asset / index.html /
    # sw.js blocks. Keep them in sync.
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    # Compress text assets — reduces transfer size ~70%
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # SPA routing: unknown paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed static assets aggressively — Vite fingerprints filenames
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    }

    # Never cache index.html — it references the hashed assets
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    }

    # PWA service worker must not be cached
    location = /sw.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    }
}
