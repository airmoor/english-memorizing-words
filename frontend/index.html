<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Primary identity -->
    <title>Lexis</title>
    <meta name="description" content="Dictionary-first spaced repetition for advanced English vocabulary." />

    <!-- Theme -->
    <meta name="theme-color" content="#0e0e11" />
    <meta name="color-scheme" content="dark light" />

    <!-- Fonts — self-hosted (precached by the PWA, work offline). @font-face
         declared in index.css; preload the two normal faces for fast first paint. -->
    <link rel="preload" href="/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/source-serif-4-latin-normal.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Icons -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/pwa-icon-source.svg" sizes="any" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />

    <!-- Apple PWA standalone -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Lexis" />

    <!-- Manifest (injected by vite-plugin-pwa in production) -->
  </head>
  <body>
    <div id="root"></div>
    <!-- Theme bootstrap — runs synchronously before React to prevent FOUC.
         Reads saved theme from localStorage, resolves the correct palette,
         and sets --color-bg-primary on <html> so the CSS background rule
         uses the right value in the very first paint.
         ThemeProvider's useEffect later confirms the same values; no conflict. -->
    <script>
      (function () {
        try {
          var s = localStorage.getItem('lexis.theme.settings');
          if (!s) return;
          var p = JSON.parse(s);
          var sysDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark  = p.mode === 'dark' || (p.mode === 'system' && sysDark);
          var theme   = isDark
            ? ({ standard: 'dark', midnight: 'midnight', violetLibrary: 'violetLibrary', emeraldDepths: 'emeraldDepths', sakuraNight: 'sakuraNight', neon: 'neon' }[p.darkVariant]  || 'dark')
            : ({ standard: 'light', sepia: 'sepia', marshmallow: 'marshmallow', arcticGlass: 'arcticGlass', solarEditorial: 'solarEditorial' }[p.lightVariant] || 'light');
          var bg = {
            light: '#f4f4f2', sepia: '#f3ead7', marshmallow: '#fef0f5',
            arcticGlass: '#f0f7ff', solarEditorial: '#faf6f0',
            dark: '#0e0e11', midnight: '#0a0e1a', violetLibrary: '#140d2a',
            emeraldDepths: '#061a14', sakuraNight: '#120a1a', neon: '#0a0a14',
          };
          var el = document.documentElement;
          el.setAttribute('data-theme', theme);
          el.style.setProperty('--color-bg-primary', bg[theme] || '#f4f4f2');
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
